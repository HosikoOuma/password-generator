<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>PASSWORD GENERATOR — dot matrix</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23111111'/%3E%3Crect x='3' y='3' width='10' height='10' fill='%23ff0000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ticker" aria-hidden="true">
    <div class="ticker__track" id="ticker"></div>
  </div>

  <header class="app-bar">
    <div class="brand">
      <span class="brand__glyph">&#9616;</span>
      <span class="brand__name">PASSWORD//GENERATOR</span>
    </div>
    <div class="app-bar__right">
      <span class="status-line">ENTROPY_<span id="entropy-meter" class="status-line__val">-- BITS</span></span>
      <button id="theme-toggle" class="ghost-btn" type="button" aria-label="Переключить тему">
        THEME:<span id="theme-label" class="ghost-btn__val">DARK</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="panel" aria-label="Параметры">
      <h2 class="panel__title">SETTINGS_</h2>

      <div class="setting">
        <div class="setting__head">
          <label for="length">LENGTH</label>
          <output id="length-val" class="setting__val">20</output>
        </div>
        <input id="length" class="slider" type="range" min="4" max="64" value="20" step="1">
        <div class="scale" aria-hidden="true">
          <span>4</span><span>16</span><span>28</span><span>40</span><span>52</span><span>64</span>
        </div>
      </div>

      <div class="setting">
        <div class="setting__head">
          <span class="setting__label">CHARACTER SET</span>
          <span id="set-bits" class="setting__val">--</span>
        </div>
        <div class="toggles" id="sets">
          <label class="toggle">
            <input type="checkbox" id="use-upper" checked>
            <span class="toggle__box"></span>
            <span class="toggle__text">UPPER&nbsp;&nbsp;A–Z</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="use-lower" checked>
            <span class="toggle__box"></span>
            <span class="toggle__text">LOWER&nbsp;&nbsp;a–z</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="use-digit" checked>
            <span class="toggle__box"></span>
            <span class="toggle__text">DIGITS&nbsp;&nbsp;0–9</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="use-symbol" checked>
            <span class="toggle__box"></span>
            <span class="toggle__text">SYMBOLS&nbsp;&nbsp;!@#$%</span>
          </label>
        </div>
      </div>

      <div class="setting setting--flat">
        <label class="toggle toggle--row">
          <input type="checkbox" id="no-ambiguous" checked>
          <span class="toggle__box"></span>
          <span>EXCLUDE AMBIGUOUS (O/0, I/l)</span>
        </label>
        <label class="toggle toggle--row">
          <input type="checkbox" id="ensure-all" checked>
          <span class="toggle__box"></span>
          <span>AT LEAST ONE FROM EACH SET</span>
        </label>
      </div>

      <button id="generate" class="red-btn" type="button">
        <span class="red-btn__glyph">&#10003;</span> GENERATE_<span id="count-val" class="red-btn__val">4</span>
      </button>
    </section>

    <section class="panel panel--output" aria-label="Результат">
      <h2 class="panel__title">OUTPUT_</h2>

      <div class="strength">
        <div class="strength__cells" id="strength-cells" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="strength__label">
          <span id="strength-name">--BITS--</span>
          <span id="strength-hint">SECURE RANDOMNESS</span>
        </div>
      </div>

      <ul class="passwords" id="passwords">
        <li class="passwords__empty" id="empty-state">PRESS GENERATE_</li>
      </ul>
    </section>
  </main>

  <footer class="foot">
    <span>CRYPTOGRAPHY.DOTMATRIX</span>
    <span>SOURCE IN BROWSER</span>
    <span>NOTHING SENT ANYWHERE</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
